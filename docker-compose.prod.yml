services:
  directus:
    # Must match the version that produced snapshots/schema.yaml — `directus schema apply`
    # validates it — and 11.17.x is also where the file editor gained focal points, which the
    # site uses to anchor cover crops. Directus runs its own DB migrations on start: back the
    # database up before the first `up -d` after a version change.
    image: directus/directus:11.17.4
    container_name: knpu-university-directus
    restart: unless-stopped
    mem_limit: 512m
    environment:
      KEY: ${KEY}
      SECRET: ${SECRET}

      PUBLIC_URL: ${PUBLIC_URL}

      DB_CLIENT: ${DB_CLIENT:-pg}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      CORS_ENABLED: ${CORS_ENABLED:-true}
      CORS_ORIGIN: ${CORS_ORIGIN}

      WEBSOCKETS_ENABLED: ${WEBSOCKETS_ENABLED:-true}

      # The admin app's default CSP is `child-src 'self' blob:`, which blocks the video preview
      # inside the WYSIWYG. Allow the same embed hosts the public site's sanitizer allows.
      CONTENT_SECURITY_POLICY_DIRECTIVES__FRAME_SRC: >-
        'self' blob: https://www.youtube.com https://www.youtube-nocookie.com
        https://youtube.com https://player.vimeo.com
      CONTENT_SECURITY_POLICY_DIRECTIVES__CHILD_SRC: >-
        'self' blob: https://www.youtube.com https://www.youtube-nocookie.com
        https://youtube.com https://player.vimeo.com

      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}

      SEED_CONTENT: ${SEED_CONTENT:-false}

      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_DRIVER: local
      STORAGE_LOCAL_ROOT: /directus/uploads
    volumes:
      - uploads:/directus/uploads
      - ./extensions:/directus/extensions
      - ./database/migrations:/directus/database/migrations
      - ./snapshots:/directus/snapshots
    networks:
      - webnet
      - dbnet
    healthcheck:
      # 127.0.0.1, not localhost: BusyBox wget resolves localhost to ::1 first and Directus
      # listens on IPv4, so the probe failed forever on a perfectly healthy container.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8055/server/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  uploads:

networks:
  webnet:
    external: true
  dbnet:
    external: true
