services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-knpu_university}
      POSTGRES_USER: ${DB_USER:-directus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-directus}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-directus} -d ${DB_DATABASE:-knpu_university}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Expose on localhost only so tools like psql can connect during development.
    # Host 5433 avoids clash with other local Postgres containers on 5432.
    ports:
      - "127.0.0.1:5433:5432"

  directus:
    image: directus/directus:11
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8055:8055"
    environment:
      KEY: ${KEY}
      SECRET: ${SECRET}

      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8055}

      DB_CLIENT: ${DB_CLIENT:-pg}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-knpu_university}
      DB_USER: ${DB_USER:-directus}
      DB_PASSWORD: ${DB_PASSWORD:-directus}

      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}

      CORS_ENABLED: ${CORS_ENABLED:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # pdf.js needs these to see that a PDF can be fetched in ranges; without them it
      # downloads whole multi-megabyte issues just to draw a thumbnail.
      CORS_EXPOSED_HEADERS: ${CORS_EXPOSED_HEADERS:-Content-Range,Accept-Ranges,Content-Length}

      WEBSOCKETS_ENABLED: ${WEBSOCKETS_ENABLED:-true}

      # The admin app's default CSP is `child-src 'self' blob:`, which blocks the video preview
      # inside the WYSIWYG. Allow the same embed hosts the public site's sanitizer allows.
      CONTENT_SECURITY_POLICY_DIRECTIVES__FRAME_SRC: >-
        'self' blob: https://www.youtube.com https://www.youtube-nocookie.com
        https://youtube.com https://player.vimeo.com
      CONTENT_SECURITY_POLICY_DIRECTIVES__CHILD_SRC: >-
        'self' blob: https://www.youtube.com https://www.youtube-nocookie.com
        https://youtube.com https://player.vimeo.com

      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
      SEED_CONTENT: ${SEED_CONTENT:-false}

      # Local file storage driver; uploads land in the named volume below.
      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_DRIVER: local
      STORAGE_LOCAL_ROOT: /directus/uploads
    volumes:
      - uploads:/directus/uploads
      - ./extensions:/directus/extensions
      - ./database/migrations:/directus/database/migrations
      - ./snapshots:/directus/snapshots

volumes:
  pg_data:
  uploads:
